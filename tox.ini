[tox]
envlist = py311, py312, py313, py314, flake8

[gh-actions]
python =
    3.14: py314
    3.13: py313
    3.12: py312
    3.11: py311

[testenv:flake8]
basepython = python3
deps = flake8
commands = flake8 poppy tests

[testenv]
setenv =
    PYTHONPATH = {toxinidir}

commands = python -m unittest discover -s tests -t {toxinidir}
